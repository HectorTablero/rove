name: Release

# Diary's release workflow minus cosign. `verify` gates both publishers: nothing reaches GHCR
# or a phone unless typecheck, unit and e2e tests pass on the same commit.

on:
  push:
    branches: ['main']
    tags: ['v*.*.*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      # Whether this commit touched anything the Android app is built from.
      app-changed: ${{ steps.scope.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The scope step diffs against the commit this push started from.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --force: known peer conflict between @hono/node-ws and @hono/node-server v2.
      - run: npm ci --force
      - run: npm run typecheck
      # No .env on purpose: config.ts reads required variables through getters.
      - run: npm test

      - name: Build the web app for e2e
        run: npm run build -w web

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Unconditional: --with-deps installs system libraries the cache does not hold.
      - run: npx playwright install --with-deps chromium
      # No @a11y step: Rove has no a11y specs yet and Playwright fails on "No tests found".
      # Add `- run: npm run test:a11y:run` back with the first one.
      - run: npm run test:e2e:run

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - run: npm audit --omit=dev --audit-level=high

      - name: Decide whether the app needs rebuilding
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A pull request publishes nothing; a manual run always builds; a tag publishes an image.
          if [ "${{ github.event_name }}" = "pull_request" ]; then echo "app=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.ref_type }}" = "tag" ]; then echo "app=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A first push or a force-push cannot be diffed: build, since a skipped release is worse.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]              || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA"              | grep -qE '^(web/|shared/|scripts/|package.json|package-lock.json|.github/workflows/release.yml)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  # Nothing here reaches a phone unless verify passed: the OTA bundle installs itself onto devices
  # that already have the app, and Capgo's boot timeout only catches a bundle that crashes on launch.
  android:
    needs: verify
    if: needs.verify.outputs.app-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci --force

      # The root package.json version is the single source of truth: tag, versionName/versionCode
      # and the OTA bundle name all derive from it. Called directly so npm's banner stays out of
      # $GITHUB_OUTPUT.
      - name: Compute version
        id: version
        run: node scripts/version-info.mjs >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        working-directory: web/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > rove-release.keystore

      - name: Write keystore.properties
        working-directory: web/android/app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=rove-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build web assets + sync Capacitor
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_AMAP_JS_KEY: ${{ secrets.VITE_AMAP_JS_KEY }}
          VITE_BETTERSTACK_SOURCE_TOKEN: ${{ secrets.BETTERSTACK_CLIENT_SOURCE_TOKEN }}
          VITE_BETTERSTACK_INGEST_URL: ${{ secrets.BETTERSTACK_CLIENT_INGEST_URL }}
        run: npm run build:app

      # web/dist is the app-mode build `cap sync` just copied into the APK, packaged for
      # over-the-air delivery. index.html must sit at the zip root.
      - name: Package OTA bundle
        run: |
          mkdir -p dist
          cd web/dist
          zip -qr "../../dist/bundle-${{ steps.version.outputs.version }}-${{ steps.version.outputs.fingerprint }}.zip" .

      - name: Build signed release APK
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease             -PappVersionCode=${{ steps.version.outputs.code }}             -PappVersionName=${{ steps.version.outputs.version }}

      - name: Prepare release assets
        run: cp web/android/app/build/outputs/apk/release/app-release.apk dist/rove.apk

      # action-gh-release never moves an existing tag, so point it at this commit first.
      - name: Move version tag to this commit
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            Built from ${{ github.sha }}.

            - `rove.apk` — full install. Needed when the native shell changes.
            - `bundle-*.zip` — web layer, delivered over the air to installed apps
              (native shell `${{ steps.version.outputs.fingerprint }}`).
          prerelease: false
          make_latest: true
          files: |
            dist/rove.apk
            dist/bundle-*.zip

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite inlines these at build time. The Amap JS key ships in the bundle regardless;
          # its domain whitelist + security code is what protects it.
          build-args: |
            VITE_AMAP_JS_KEY=${{ secrets.VITE_AMAP_JS_KEY }}
            VITE_BETTERSTACK_SOURCE_TOKEN=${{ secrets.BETTERSTACK_CLIENT_SOURCE_TOKEN }}
            VITE_BETTERSTACK_INGEST_URL=${{ secrets.BETTERSTACK_CLIENT_INGEST_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
