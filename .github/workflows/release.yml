name: Release

# Diary's release workflow minus the Android job (Capacitor is dormant here) and cosign.
# `verify` gates the image: nothing reaches GHCR unless typecheck, unit, e2e and a11y all pass.

on:
  push:
    branches: ['main']
    tags: ['v*.*.*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --force: known peer conflict between @hono/node-ws and @hono/node-server v2.
      - run: npm ci --force
      - run: npm run typecheck
      # No .env on purpose: config.ts reads required variables through getters.
      - run: npm test

      - name: Build the web app for e2e
        run: npm run build -w web

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Unconditional: --with-deps installs system libraries the cache does not hold.
      - run: npx playwright install --with-deps chromium
      # No @a11y step: Rove has no a11y specs yet and Playwright fails on "No tests found".
      # Add `- run: npm run test:a11y:run` back with the first one.
      - run: npm run test:e2e:run

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - run: npm audit --omit=dev --audit-level=high

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite inlines these at build time. The Amap JS key ships in the bundle regardless;
          # its domain whitelist + security code is what protects it.
          build-args: |
            VITE_AMAP_JS_KEY=${{ secrets.VITE_AMAP_JS_KEY }}
            VITE_BETTERSTACK_SOURCE_TOKEN=${{ secrets.BETTERSTACK_CLIENT_SOURCE_TOKEN }}
            VITE_BETTERSTACK_INGEST_URL=${{ secrets.BETTERSTACK_CLIENT_INGEST_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
