# Rove on a VPS: the app container and the RSSHub it polls through.
#
# MongoDB and Redis are deliberately not here — both are the shared instances already running on
# the host, named by MONGODB_URI and REDIS_URL in .env. Those hostnames (`redis`, `mongo`) only
# resolve on the Docker network the shared containers live on, so this file joins that network
# instead of creating its own: set DOCKER_NETWORK in .env to its name (`docker network ls`, or
# `docker inspect redis --format '{{range $k,$_ := .NetworkSettings.Networks}}{{$k}}{{end}}'`).
# Deploy with `docker compose pull app && docker compose up -d` (the image CI publishes to GHCR
# on every push to main), or build on the host instead with `docker compose up -d --build`.
#
# RSSHub is pinned rather than `latest`: its routes are the moving part of this whole system, and
# an unplanned upgrade is the likeliest way for a feed to change shape on a Tuesday. Bump the tag
# on purpose, then check Settings → Sources still reports "found > 0" for each feed.
services:
  app:
    image: ghcr.io/hectortablero/rove:main
    build:
      context: .
      args:
        VITE_AMAP_JS_KEY: ${VITE_AMAP_JS_KEY}
        VITE_BETTERSTACK_SOURCE_TOKEN: ${VITE_BETTERSTACK_SOURCE_TOKEN:-}
        VITE_BETTERSTACK_INGEST_URL: ${VITE_BETTERSTACK_INGEST_URL:-}
    env_file: .env
    environment:
      # Inside the compose network the RSSHub container is reachable by service name.
      RSSHUB_BASE_URL: http://rsshub:1200
    ports:
      - '3000:3000'
    depends_on:
      - rsshub
    restart: unless-stopped

  rsshub:
    # `latest` until a date tag has been pulled once and works; then pin that tag here.
    image: diygod/rsshub:latest
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      # The shared Redis. RSSHub prefixes its own keys with `rsshub:`; append a database index
      # (redis://redis:6379/2) if another RSSHub ever shares the instance.
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env, e.g. redis://redis:6379}
      # Only this app talks to it; nothing here needs to be reachable from outside the network.
      ACCESS_KEY: ''
    restart: unless-stopped

networks:
  default:
    external: true
    name: ${DOCKER_NETWORK:?set DOCKER_NETWORK in .env to the network the shared Redis and Mongo are on}
